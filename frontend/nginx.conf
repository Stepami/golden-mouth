server {
  listen 80;
  root /usr/share/nginx/html;
  server_tokens off;

  # add_header внутри location отменяет заголовки сервера, поэтому общий набор повторяем в каждом location.
  # Встраивать страницу можно только в Telegram (web.telegram.org открывает Mini App во фрейме).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }
}
