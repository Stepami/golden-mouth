name: Backend CI

on:
  push:
    branches-ignore:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow == 'Release' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          check-latest: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Reki.slnx

      - name: Verify code style
        run: dotnet format Reki.slnx style --verify-no-changes --no-restore --severity warn --verbosity minimal

      - name: Build
        run: dotnet build Reki.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/Reki.Tests/Reki.Tests.csproj --configuration Release --no-build
