name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate semantic version
    runs-on: ubuntu-latest
    outputs:
      image-version: ${{ steps.semver.outputs.image-version }}
    steps:
      - name: Validate tag
        id: semver
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag" =~ $semver ]]; then
            echo "Tag '$tag' is not a semantic version (for example, 0.1.0)." >&2
            exit 1
          fi

          echo "image-version=${tag//+/-}" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend checks
    needs: validate-tag
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend checks
    needs: validate-tag
    uses: ./.github/workflows/frontend-ci.yml

  create-release:
    name: Create draft release
    needs: [validate-tag, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4
        with:
          versionSpec: "0.20.x"

      - name: Create draft release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/create@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ github.ref_name }}
          name: ${{ github.ref_name }}

  deploy:
    name: Deploy to production
    needs: [validate-tag, create-release]
    runs-on: self-hosted
    env:
      COMPOSE_FILE: compose.yml:compose.production.yml
      REKI_VERSION: ${{ needs.validate-tag.outputs.image-version }}
      TG_PAT: ${{ secrets.TG_PAT }}
      LLM_PAT: ${{ secrets.LLM_PAT }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      OPENOBSERVE_EMAIL: ${{ secrets.OPENOBSERVE_EMAIL }}
      OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate production configuration
        shell: bash
        run: |
          test -r /etc/reki/tls/fullchain.pem
          test -r /etc/reki/tls/private.key
          docker compose config --quiet

      - name: Build release images
        shell: bash
        run: docker compose build backend frontend

      - name: Deploy release
        shell: bash
        run: docker compose up --detach --no-build --remove-orphans --wait --wait-timeout 180

      - name: Show container status on failure
        if: failure()
        shell: bash
        run: docker compose ps

  publish-release:
    name: Publish release
    needs: [validate-tag, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Set up GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4
        with:
          versionSpec: "0.20.x"

      - name: Publish release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/publish@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ github.ref_name }}
