name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    uses: ./.github/workflows/backend-ci.yml

  frontend:
    name: Frontend checks
    uses: ./.github/workflows/frontend-ci.yml

  secret-scan:
    name: Secret scan
    uses: ./.github/workflows/secret-scan.yml

  version:
    name: Tag checked commit
    needs: [backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.gitversion.outputs.majorMinorPatch }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.8.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Push version tag
        shell: bash
        env:
          VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"

  deploy:
    name: Deploy to production
    needs: version
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  create-release:
    name: Create draft release
    if: ${{ !contains(github.event.head_commit.message, '[skip-release]') }}
    needs: [version, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4
        with:
          versionSpec: "0.20.x"

      - name: Create draft release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/create@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}

  publish-release:
    name: Publish release
    needs: [version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Set up GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4
        with:
          versionSpec: "0.20.x"

      - name: Publish release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/publish@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ needs.version.outputs.version }}

      - name: Close milestone with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/close@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ needs.version.outputs.version }}
