services:
  frontend:
    build:
      target: development
    environment:
      TG_PAT: ${TG_PAT:?TG_PAT is required}
      REKI_BACKEND_PROXY_TARGET: http://backend:8080
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-8080}:5173"
    volumes: !override
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ > /dev/null || exit 1"]

  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TelegramMiniAppAuthorizationOptions__Token: ${TG_PAT:?TG_PAT is required}

volumes:
  frontend-node-modules:
