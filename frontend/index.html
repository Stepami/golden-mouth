<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E13" />
    <link rel="icon" href="/favicon.ico?v=wave-2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=wave-2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=wave-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=wave-2" />
    <link rel="manifest" href="/site.webmanifest?v=wave-2" />
    <link rel="preload" as="image" href="/src/assets/masha-v2.jpg" fetchpriority="high" />
    <title>Реки</title>
  </head>
  <body>
    <div id="root">
      <style>
        body { margin: 0; background: #0E0E13; }
        .boot-loader { box-sizing: border-box; min-height: 100vh; min-height: 100dvh; background: #0E0E13; color: #F2F1F6; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 32px; text-align: center; font: 16px/1.5 system-ui, sans-serif; }
        .boot-loader b { font-size: 28px; color: #FF6091; }
        .boot-loader p { margin: 16px 0 0; }
        .boot-loader .boot-slow { color: #A5A1B7; max-width: 300px; visibility: hidden; animation: boot-reveal 0s 3s forwards; }
        .boot-loader a { color: #C8A6FF; visibility: hidden; animation: boot-reveal 0s 15s forwards; margin-top: 20px; }
        @keyframes boot-reveal { to { visibility: visible; } }
      </style>
      <div class="boot-loader" role="status" aria-live="polite">
        <b>реки</b>
        <p>Загружаем игру…</p>
        <p class="boot-slow">Загрузка занимает больше времени. Оставь экран открытым.</p>
        <a href="">Обновить страницу</a>
        <noscript>Для игры нужно включить JavaScript.</noscript>
      </div>
    </div>
    <script src="/runtime-config/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
