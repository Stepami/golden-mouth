name: Secret scan

on:
  push:
    branches-ignore:
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow == 'Release' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan tracked files for secrets
        run: sh .github/scripts/check-secrets.sh --all
