syncSource:
  replicaSet:
    hostAndPort: "mongo:27017"
    scramAuth:
      username: "mongotUser"
      passwordFile: "/secrets/passwordFile"
      authSource: "admin"
      tls:
        enabled: false
  replicationReader:
    readPreference: "secondaryPreferred"
storage:
  dataPath: "/data/mongot"
server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"
healthCheck:
  address: "0.0.0.0:8080"
logging:
  verbosity: INFO
