name: Backend CI

on:
  push:
    branches-ignore:
      - master
    paths:
      - "backend/**"
      - "frontend/openapi/**"
      - ".github/scripts/check-openapi.py"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow == 'Release' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Reki.slnx

      - name: Verify code style
        run: dotnet format Reki.slnx style --verify-no-changes --no-restore --severity warn --verbosity minimal

      - name: Build
        run: dotnet build Reki.slnx --configuration Release --no-restore

      - name: Check frontend OpenAPI snapshot
        run: python3 ../.github/scripts/check-openapi.py

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # This also runs on backend-only changes, so API drift cannot bypass the frontend build.
      - name: Build frontend against the saved contract
        working-directory: frontend
        run: npm ci && npm run build

      - name: Test
        run: |
          # Capture startup failures before Testcontainers removes the failed Mongo container.
          docker events --filter type=container --filter label=org.testcontainers=true --filter event=die --format '{{.Actor.ID}}' |
            while read -r container_id; do
              docker inspect --format '{{.Name}} exit={{.State.ExitCode}} OOM={{.State.OOMKilled}} error={{.State.Error}}' "$container_id" || true
              docker logs --tail 60 "$container_id" 2>&1 || true
            done &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true' EXIT
          df -h /
          free -m
          dotnet test --project tests/Reki.Tests/Reki.Tests.csproj --configuration Release --no-build
