name: Backend CI

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for a compatible .NET SDK
        id: dotnet
        shell: bash
        run: |
          if command -v dotnet >/dev/null 2>&1 && dotnet --version >/dev/null 2>&1; then
            echo "setup-required=false" >> "$GITHUB_OUTPUT"
            dotnet --version
          else
            echo "setup-required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.dotnet.outputs.setup-required == 'true'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
          check-latest: false

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore Reki.slnx

      - name: Verify code style
        run: dotnet format Reki.slnx style --verify-no-changes --no-restore --severity warn --verbosity minimal

      - name: Build
        run: dotnet build Reki.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/Reki.Tests/Reki.Tests.csproj --configuration Release --no-build
