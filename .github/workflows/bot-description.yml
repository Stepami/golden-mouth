name: Update game bot description
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bot-description
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish and verify approved description
        env:
          TG_PAT: ${{ secrets.TG_PAT }}
        run: python3 scripts/update_bot_description.py
      - name: Preserve previous public description
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: previous-bot-description
          path: bot-description-before.json
          if-no-files-found: ignore
          retention-days: 7
