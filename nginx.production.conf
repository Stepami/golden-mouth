map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

js_import daily_metrics from /etc/nginx/daily-metrics/handler.js;
js_import metrika_goals from /etc/nginx/metrika-goals/handler.js;

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name reki-app.ru;

  location = /healthz {
    access_log off;
    return 200 "healthy\n";
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://reki-app.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name reki-app.ru;

  server_tokens off;
  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/private.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /healthz {
    access_log off;
    return 200 "healthy\n";
  }

  location = /analytics/goals {
    access_log off;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    limit_req zone=metrika_goals burst=12 nodelay;
    limit_req_status 429;
    resolver 127.0.0.11;
    js_fetch_timeout 4s;
    js_fetch_max_response_buffer_size 16k;
    js_content metrika_goals.post;
  }

  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name openobserve.reki-app.ru;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    try_files $uri =404;
  }

  location / {
    return 301 https://openobserve.reki-app.ru$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name openobserve.reki-app.ru;

  server_tokens off;
  ssl_certificate /etc/letsencrypt/live/openobserve.reki-app.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/openobserve.reki-app.ru/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location = /api/v1/metrics/daily {
    resolver 127.0.0.11;
    js_fetch_timeout 9s;
    js_fetch_max_response_buffer_size 64k;
    js_content daily_metrics.get;
  }

  location / {
    proxy_pass http://openobserve:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
