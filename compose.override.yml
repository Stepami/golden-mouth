services:
  frontend:
    volumes:
      - ./frontend/public/runtime-config/config.development.js:/usr/share/nginx/html/runtime-config/config.js:ro

  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Llm__ApiKey: local-model-runner
      Llm__TimeoutSeconds: 120
    models:
      reki_llm:
        endpoint_var: Llm__BaseUrl
        model_var: Llm__Model

models:
  reki_llm:
    model: ai/qwen2.5:3B-Q4_K_M
    context_size: 8192
