<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>document.documentElement.dataset.theme = "light";</script>
    <link rel="icon" href="/favicon.ico?v=wave-2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=wave-2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=wave-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=wave-2" />
    <link rel="manifest" href="/site.webmanifest?v=wave-2" />
    <title>Реки</title>
  </head>
  <body>
    <div id="root">
      <style>
        :root { --boot-bg:#fff; --boot-card:#f5f5f5; --boot-line:#e5e7e3; --boot-text:#171918; --boot-muted:#626863; --boot-accent:#171918; }
        :root[data-theme=light] { --boot-bg:#fff; --boot-card:#f7f9f9; --boot-line:#cfd9de; --boot-text:#0f1419; --boot-muted:#536471; }
        body { margin:0; background:var(--boot-bg); }
        .boot-loader { box-sizing:border-box;min-height:100vh;min-height:100dvh;background:var(--boot-bg);color:var(--boot-text);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;gap:16px; }
        .boot-loader .boot-emblem { display:grid;place-items:center;width:80px;height:80px;border:1px solid var(--boot-line);border-radius:24px;background:var(--boot-card);color:var(--boot-accent);font-size:40px; }
        .boot-loader b { font-size:32px;letter-spacing:-.025em; }
        .boot-loader p { margin:0;color:var(--boot-muted); }
        .boot-loader .boot-slow { color:var(--boot-muted);max-width:300px;visibility:hidden;animation:boot-reveal 0s 3s forwards; }
        .boot-loader a { color:var(--boot-accent);visibility:hidden;animation:boot-reveal 0s 15s forwards; }
        .boot-loader .boot-track { width:140px;height:4px;border-radius:99px;background:var(--boot-line);overflow:hidden; }.boot-loader .boot-track i { display:block;width:40%;height:100%;background:var(--boot-accent);animation:boot-progress 1.4s ease-in-out infinite alternate; }@keyframes boot-progress { to { transform:translateX(150%); } }@media(prefers-reduced-motion:reduce) { .boot-loader .boot-track i { animation:none; } }
        @keyframes boot-reveal { to { visibility: visible; } }
      </style>
      <div class="boot-loader" role="status" aria-live="polite">
        <div class="boot-emblem" aria-hidden="true">✦</div><b>Реки</b>
        <p>Открываем твои миры</p><div class="boot-track" aria-hidden="true"><i></i></div>
        <p class="boot-slow">Загрузка занимает больше времени. Оставь экран открытым.</p>
        <a href="">Обновить страницу</a>
        <noscript>Для игры нужно включить JavaScript.</noscript>
      </div>
    </div>
    <script src="/runtime-config/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
