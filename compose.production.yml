services:
  gateway:
    image: nginx:1.29.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/reki/tls/fullchain.pem:/etc/nginx/tls/fullchain.pem:ro
      - /etc/reki/tls/private.key:/etc/nginx/tls/private.key:ro
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1/healthz || exit 1"]
      interval: 5m
      start_interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3m
    restart: unless-stopped

  frontend:
    image: reki-frontend:${REKI_VERSION:-local}

  backend:
    image: reki-backend:${REKI_VERSION:-local}
    environment:
      Llm__ApiKey: ${LLM_PAT:?LLM_PAT is required}
      Llm__BaseUrl: ${LLM_BASE_URL:?LLM_BASE_URL is required}
      Llm__Model: ${LLM_MODEL:?LLM_MODEL is required}
