name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing Git tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Validate version format
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version '$VERSION' is not a semantic version (for example, 0.1.0)." >&2
            exit 1
          fi

      - name: Check out version tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false

      - name: Set up GitReleaseManager
        uses: gittools/actions/gitreleasemanager/setup@v4
        with:
          versionSpec: "0.20.x"

      - name: Create draft release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/create@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ inputs.version }}
          name: ${{ inputs.version }}

      - name: Publish release with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/publish@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ inputs.version }}

      - name: Close milestone with GitReleaseManager
        uses: gittools/actions/gitreleasemanager/close@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          milestone: ${{ inputs.version }}
